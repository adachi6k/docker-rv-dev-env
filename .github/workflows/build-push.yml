name: Build and push Docker image

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - '.github/workflows/build-push.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image for validation
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: docker-rv-dev-env:test

      - name: Verify runtime dependencies and Verilator smoke tests
        run: |
          docker run --rm docker-rv-dev-env:test bash -e -lc '
            command -v flex
            command -v bison
            command -v bc
            clang --version
            clang++ --version
            ccache --version
            mold --version
            dpkg -s libssl-dev libelf-dev >/dev/null
            test "$VERILATOR_ROOT" = /opt/verilator/share/verilator
            verilator --version
            test -f /usr/include/zlib.h

            tmpdir=$(mktemp -d)
            trap "rm -rf \"$tmpdir\"" EXIT
            cd "$tmpdir"

          cat > top.sv <<'"'"'SV'"'"'
          module top;
          endmodule
          SV

          cat > sim_main.cpp <<'"'"'CPP'"'"'
          #include "Vtop.h"
          #include "verilated.h"
          #include "verilated_fst_c.h"

          int main(int argc, char** argv) {
            Verilated::commandArgs(argc, argv);
            auto* top = new Vtop;
            auto* trace = new VerilatedFstC;
            top->trace(trace, 99);
            delete trace;
            delete top;
            return 0;
          }
          CPP

          cat > CMakeLists.txt <<'"'"'CMAKE'"'"'
          cmake_minimum_required(VERSION 3.8)
          project(VerilatorSmoke CXX)
          find_package(verilator REQUIRED HINTS $ENV{VERILATOR_ROOT})
          add_executable(sim sim_main.cpp)
          verilate(sim PREFIX Vtop TRACE_FST SOURCES top.sv)
          CMAKE

            # Verilators CMake verilate() consumes OBJCACHE_ENABLED. Disable its
            # global launcher so CMAKE_CXX_COMPILER_LAUNCHER runs ccache only once.
            cmake -S . -B build -GNinja \
              -DCMAKE_CXX_COMPILER=clang++ \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DOBJCACHE_ENABLED=OFF \
              -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=mold
            cmake --build build --verbose
            ./build/sim
          '

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{date 'YYYYMMDD'}}
            type=sha,prefix=,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
